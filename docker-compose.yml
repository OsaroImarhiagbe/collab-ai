services:
  postgresql_db:
    image: postgres:17-alpine
    container_name: postgresql-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgresql_db_data:/var/lib/postgresql/data
    networks:
      - app_network
  
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli","-a","${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracking-app-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.development
    restart: always
    depends_on:
      postgresql_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 10s
      timeout: 5sg
      retries: 5
      start_period: 15s
    networks:
      - app_network
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracking-app-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env.development
    environment:
      - CI=true
    restart: always
    depends_on:
      - backend
    networks:
      - app_network


volumes:
  postgresql_db_data:
  redis_data:

networks:
  app_network:
    driver: bridge