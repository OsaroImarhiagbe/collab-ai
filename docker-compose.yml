version: "3.9"
services:
  postgresql_db:
    image: postgres:18-alpine
    container_name: postgresql-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - postgresql_db_data:/var/lib/postgresql/data
    networks:
      - app_network
  
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli","-a","${yourpassword}", "PING"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - app_network
  
  backend:
    image: python:3.12-slim
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-tracking-app-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.development
    restart: always
    depends_on:
      postgresql_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
      
  frontend:
    image: node:20-alpine
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracking-app-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    env_file:
      - ./frontend/.env.development
    restart: always
    depends_on:
      - backend
    networks:
      - app_network


volumes:
  postgresql_db_data:
  redis_data:

networks:
  app_network:
    driver: bridge