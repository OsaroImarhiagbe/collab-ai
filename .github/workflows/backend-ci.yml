name: Backend CI for Dev to Main

on:
    pull_request:
        branches: [ main ]
        paths: 
            - "backend/**"
            - ".github/workflows/backend-ci.yml"

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            SECRET_KEY: ci-test-secret-key-not-real
            ENVIRONMENT: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"
                cache: "pip"
            
            - name: Install dependencies
              working-directory: backend
              run: pip install -r requirements.txt
            
            
            - name: Lint with Ruf
              working-directory: backend
              run: |
                pip install ruff
                ruff check .
            

            - name: Run tests
              working-directory: backend
              run: pytest app/ -v

